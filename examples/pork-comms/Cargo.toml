[package]
name = "pork-comms"
version = "1.0.0"
edition = "2024"
authors = ["Lewin Probst <info@emirror.de>"]
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/emirror-de/pork"
description = "Example host/child communication binaries built on pork and pork-proto"
publish = false

[dependencies]
pork = { path = "../../pork", features = ["codec-json", "codec-postcard"] }
pork-proto = { path = "../../pork-proto", features = ["codec-json", "codec-postcard"] }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
