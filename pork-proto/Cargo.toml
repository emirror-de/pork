[package]
name = "pork-proto"
version = "2.0.0"
edition = "2024"
authors = ["Lewin Probst <info@emirror.de>"]
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/emirror-de/pork"
description = "Shared protocol types and codecs for pork control messages, typed IPC envelopes, and dual-channel workflows"
homepage = "https://github.com/emirror-de/pork"
documentation = "https://docs.rs/pork-proto"
keywords = ["ipc", "protocol", "codec", "serde", "process"]
categories = ["encoding", "asynchronous", "development-tools"]

[lints]
workspace = true

[features]
default = []
codec-json = ["dep:serde_json"]
codec-postcard = ["dep:postcard"]

[dependencies]
postcard = { version = "1.1.3", optional = true, features = ["use-std"] }
serde.workspace = true
serde_json = { version = "1.0.149", optional = true }

[package.metadata.docs.rs]
all-features = true
