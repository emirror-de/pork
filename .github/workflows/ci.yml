name: CI

on:
  push:
    branches:
      - main
      - "version/*"
      - nightly
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings

jobs:
  fast-pr-check:
    name: Fast PR validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable) with rustfmt and clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo/target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy check (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests (workspace)
        run: cargo test --workspace

      - name: All features and targets (workspace)
        run: cargo test --workspace --all-features --all-targets

  feature-matrix:
    name: Feature matrix
    needs: [fast-pr-check]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - desc: pork-default
            cmd: cargo test -p pork
          - desc: pork-host-only
            cmd: cargo test -p pork --no-default-features --features host
          - desc: pork-client-only
            cmd: cargo test -p pork --no-default-features --features client
          - desc: pork-host-client
            cmd: cargo test -p pork --no-default-features --features host,client
          - desc: pork-host-postcard
            cmd: cargo test -p pork --no-default-features --features host,codec-postcard
          - desc: pork-client-postcard
            cmd: cargo test -p pork --no-default-features --features client,codec-postcard
          - desc: pork-proto-default
            cmd: cargo test -p pork-proto
          - desc: pork-proto-json
            cmd: cargo test -p pork-proto --no-default-features --features codec-json
          - desc: pork-proto-postcard
            cmd: cargo test -p pork-proto --no-default-features --features codec-postcard
          - desc: examples-pork-comms
            cmd: cargo test -p pork-comms
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo/target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Test ${{ matrix.desc }}
        run: ${{ matrix.cmd }}

  doc-tests:
    name: Documentation tests
    needs: [fast-pr-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo/target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Doc tests
        run: cargo test --workspace --doc

  msrv:
    name: MSRV check (1.89)
    needs: [fast-pr-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (1.89)
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Cache cargo/target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-

      - name: Check workspace compiles on MSRV
        run: cargo check --workspace

  security:
    name: Security audit
    needs: [feature-matrix, doc-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo/target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Run cargo audit
        run: cargo audit

      - name: Run cargo deny
        run: cargo deny check
